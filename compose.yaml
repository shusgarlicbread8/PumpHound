name: pumphound

services:
  postgres:
    image: postgres:17-alpine
    # Working set (decisions ~900 MB, archive indexes) far exceeds the 128 MB default; observed
    # multi-second DataFileRead waits stalled the collector and paper loop. Docker VM is 3.8 GB
    # shared with ClickHouse (capped in db/clickhouse/config.d/memory.xml).
    #
    # 2026-09-10: volume moved off the external X9 sparsebundle onto the internal SSD (bind mount
    # below, not a Docker-managed named volume) after `iostat` showed the X9 sustaining
    # 100-300+ MB/s / 2,000-10,000+ tx/s continuously, with a 19h slow-query log recording bare
    # `SELECT 1`/`COMMIT` (touching zero tables) taking up to 72.7s — a below-the-SQL-layer disk
    # bottleneck, not a query problem. See docs/DATA_DURABILITY.md for the full investigation.
    # `synchronous_commit=off` predates this move (originally: fsync on the X9's APFS sparsebundle
    # measured ~175x slower than local disk). It's now on fast local storage, so the original
    # throughput justification is weaker than when this was set — left unchanged for now since
    # durability tuning is a separate decision from the storage-location fix, not revisited here.
    # The NDJSON journal under PUMPHOUND_DATA_DIR remains the evidence of record and is replayable
    # regardless of this setting.
    command: >-
      postgres -c shared_buffers=768MB -c effective_cache_size=2GB -c work_mem=16MB
      -c maintenance_work_mem=128MB -c random_page_cost=1.1
      -c synchronous_commit=off -c wal_writer_delay=200ms
    environment:
      POSTGRES_USER: pumphound
      POSTGRES_PASSWORD: pumphound
      POSTGRES_DB: pumphound
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - /Users/shubhamkumar/PumpHoundFastData/postgres:/var/lib/postgresql/data
      - ./db/postgres/001_core.sql:/docker-entrypoint-initdb.d/001_core.sql:ro
      - ./db/postgres/002_intelligence.sql:/docker-entrypoint-initdb.d/002_intelligence.sql:ro
      - ./db/postgres/003_autonomous_paper.sql:/docker-entrypoint-initdb.d/003_autonomous_paper.sql:ro
      - ./db/postgres/004_candidate_enrichment.sql:/docker-entrypoint-initdb.d/004_candidate_enrichment.sql:ro
      - ./db/postgres/005_feature_snapshot_cutoff.sql:/docker-entrypoint-initdb.d/005_feature_snapshot_cutoff.sql:ro
      - ./db/postgres/006_adaptive_learning.sql:/docker-entrypoint-initdb.d/006_adaptive_learning.sql:ro
      - ./db/postgres/007_hot_set.sql:/docker-entrypoint-initdb.d/007_hot_set.sql:ro
      - ./db/postgres/008_product_truth.sql:/docker-entrypoint-initdb.d/008_product_truth.sql:ro
      - ./db/postgres/009_product_truth_indexes.sql:/docker-entrypoint-initdb.d/009_product_truth_indexes.sql:ro
      - ./db/postgres/010_integrity_quarantines.sql:/docker-entrypoint-initdb.d/010_integrity_quarantines.sql:ro
      - ./db/postgres/011_launch_identity_quarantine.sql:/docker-entrypoint-initdb.d/011_launch_identity_quarantine.sql:ro
      - ./db/postgres/012_canonical_event_revisions.sql:/docker-entrypoint-initdb.d/012_canonical_event_revisions.sql:ro
      - ./db/postgres/013_model_registry_integrity.sql:/docker-entrypoint-initdb.d/013_model_registry_integrity.sql:ro
      - ./db/postgres/014_position_quarantine_propagation.sql:/docker-entrypoint-initdb.d/014_position_quarantine_propagation.sql:ro
      - ./db/postgres/015_intelligence_refresh_indexes.sql:/docker-entrypoint-initdb.d/015_intelligence_refresh_indexes.sql:ro
      - ./db/postgres/016_pending_research_intent_index.sql:/docker-entrypoint-initdb.d/016_pending_research_intent_index.sql:ro
      - ./db/postgres/017_execution_twin.sql:/docker-entrypoint-initdb.d/017_execution_twin.sql:ro
      - ./db/postgres/018_paper_loop_hot_path_indexes.sql:/docker-entrypoint-initdb.d/018_paper_loop_hot_path_indexes.sql:ro
      - ./db/postgres/019_exec_select.sql:/docker-entrypoint-initdb.d/019_exec_select.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pumphound -d pumphound"]
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:26.1
    environment:
      CLICKHOUSE_DB: pumphound
      CLICKHOUSE_USER: pumphound
      CLICKHOUSE_PASSWORD: pumphound
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9009:9000"
    volumes:
      - /Users/shubhamkumar/PumpHoundFastData/clickhouse:/var/lib/clickhouse
      - ./db/clickhouse/001_events.sql:/docker-entrypoint-initdb.d/001_events.sql:ro
      - ./db/clickhouse/002_insert_buffering.sql:/docker-entrypoint-initdb.d/002_insert_buffering.sql:ro
      - ./db/clickhouse/config.d/memory.xml:/etc/clickhouse-server/config.d/memory.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "pumphound", "--password", "pumphound", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  nats:
    image: nats:2.11-alpine
    command: ["-js", "-m", "8222", "-sd", "/data"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - pumphound-nats:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pumphound-nats:
