[project]
name = "pumphound-ml"
version = "0.1.0"
description = "PumpHound research, graph and model worker"
requires-python = ">=3.12,<3.13"
dependencies = [
  "polars>=1.30",
  "duckdb>=1.3",
  "pyarrow>=20.0",
  "xgboost>=3.0",
  "lightgbm>=4.6",
  "scikit-learn>=1.6",
  "shap>=0.47",
  "optuna>=4.3",
  "mlflow>=3.1",
  "igraph>=0.11",
  "leidenalg>=0.10",
  "fastapi>=0.116",
  "uvicorn[standard]>=0.35",
  "httpx>=0.28",
  "pydantic>=2.11",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "clickhouse-connect>=0.8",
  "orjson>=3.10",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ml/pumphound_ml"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
