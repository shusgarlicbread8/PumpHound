[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/protocol-pump",
    "crates/protocol-pumpswap",
    "crates/chain-source",
    "crates/storage",
    "crates/market-state",
    "crates/feature-core",
    "crates/paper-core",
    "crates/execution-twin",
    "crates/api-contract",
    "services/collector",
    "services/core-api",
]
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
edition = "2021"
license = "UNLICENSED"
version = "0.1.0"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
async-nats = "0.41"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bs58 = "0.5"
bytes = "1.10"
chrono = { version = "0.4", features = ["serde"] }
curve25519-dalek = { version = "4.1", default-features = false, features = ["alloc"] }
clickhouse = { version = "0.13", features = ["time", "uuid", "chrono"] }
futures = "0.3"
hex = "0.4"
hmac = "0.12"
http = "1"
parking_lot = "0.12"
prost = "0.13"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }
thiserror = "2.0"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1.47", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tonic = "0.13"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2.5"
uuid = { version = "1.16", features = ["v7", "serde"] }

pumphound-domain = { path = "crates/domain" }
pumphound-protocol-pump = { path = "crates/protocol-pump" }
pumphound-protocol-pumpswap = { path = "crates/protocol-pumpswap" }
pumphound-chain-source = { path = "crates/chain-source" }
pumphound-storage = { path = "crates/storage" }
pumphound-market-state = { path = "crates/market-state" }
pumphound-feature-core = { path = "crates/feature-core" }
pumphound-paper-core = { path = "crates/paper-core" }
pumphound-execution-twin = { path = "crates/execution-twin" }
pumphound-api-contract = { path = "crates/api-contract" }
