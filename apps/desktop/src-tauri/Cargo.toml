[package]
name = "pumphound-desktop"
version = "0.1.0"
description = "PumpHound research terminal"
authors = ["PumpHound"]
edition = "2021"
license = "UNLICENSED"
rust-version = "1.85"

[lib]
name = "pumphound_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "3"

# Standalone package — not a member of the repo workspace.
[workspace]
